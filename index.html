<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sitio web de [Hz]</title>
  <style>
    @font-face {
      font-family: 'CaviarDreams';
      src: url('fonts/CaviarDreams.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --gap: clamp(10px, 2.5vmin, 24px);
      --frame-w: min(86vw, 1100px);
      --frame-h: min(76vh, 800px);
      --text: #fff;
      --bg: #000;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'CaviarDreams', system-ui, Arial, sans-serif;
    }

    /* Marca */
    .brand {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      user-select: none;
    }

    .brand .logo-box {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1.5px solid #fff;
      border-radius: 8px;
      box-sizing: border-box;
      background: transparent;
    }

    .brand img {
      max-width: 40px;
      max-height: 40px;
      filter: invert(1);
      display: block;
    }

    .brand span {
      font-weight: 700;
      letter-spacing: .02em;
      opacity: .8;
    }

    /* Hero */
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 6vmin 0;
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3vmin, 28px);
    }

    .frame {
      width: var(--frame-w);
      height: var(--frame-h);
      display: flex;
      gap: var(--gap);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
    }

    .frame:focus-visible {
      box-shadow: 0 0 0 3px #ffffff44;
      border-radius: 12px;
    }

    .col {
      height: 86%;
      background: transparent;
      border: 2px solid #fff;
      box-sizing: border-box;
      box-shadow: 0 0 6px #fff, 0 0 16px #ffffffb3, 0 0 32px #ffffff80, 0 0 64px #ffffff4d;
      transition: width 380ms ease, height 300ms ease, transform 120ms ease;
    }

    .frame:active .col {
      transform: translateY(0.5px);
    }

    .menu {
      display: flex;
      gap: clamp(14px, 3.2vmin, 28px);
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .menu a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: .02em;
      opacity: .84;
      transition: opacity .2s ease, text-shadow .2s ease;
    }

    .menu a:hover,
    .menu a:focus {
      opacity: 1;
      text-shadow: 0 0 6px #fff, 0 0 18px #ffffff88;
      outline: none;
    }

    /* Idiomas */
    .lang {
      position: fixed;
      top: 24px;
      right: 16px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .lang button {
      background: none;
      border: none;
      padding: 0;
      color: #fff;
      font: inherit;
      font-size: .85rem;
      letter-spacing: .06em;
      opacity: .45;
      cursor: pointer;
      transition: opacity .2s ease, text-shadow .2s ease;
    }

    .lang button:hover,
    .lang button.on {
      opacity: 1;
      filter: drop-shadow(0 0 4px #ffffffaa);
    }

    .lang svg {
      display: block;
      width: 24px;
      height: 16px;
      border-radius: 2px;
      outline: 1px solid #ffffff40;
    }

    /* Teléfono: que no se estire a lo alto */
    @media (max-width: 720px) {
      :root {
        --frame-w: 88vw;
        --frame-h: 66vw;
      }
      .wrap {
        min-height: 100svh;
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <header class="brand" aria-label="Marca">
    <a class="logo-box" href="#">
      <img src="logo.png" alt="Logotipo" onerror="this.style.display='none'">
    </a>
    <span>[Hz]</span>
  </header>

  <!-- IDIOMAS -->
  <nav class="lang" id="lang" aria-label="Idioma">
    <button data-lang="es" title="Español">
      <svg viewBox="0 0 9 6" preserveAspectRatio="none"><rect width="9" height="6" fill="#74ACDF"/><rect y="2" width="9" height="2" fill="#fff"/><circle cx="4.5" cy="3" r=".6" fill="#F6B40E"/></svg>
    </button>
    <button data-lang="en" title="English">
      <svg viewBox="0 0 60 30" preserveAspectRatio="none"><clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>
    </button>
    <button data-lang="fr" title="Français">
      <svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>
    </button>
    <button data-lang="de" title="Deutsch">
      <svg viewBox="0 0 5 3" preserveAspectRatio="none"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>
    </button>
  </nav>

  <!-- Hero -->
  <main>
    <section class="wrap">
      <div class="stack">
        <div class="frame" id="frame" role="button" tabindex="0" title="Click para cambiar">
          <div class="col"></div>
          <div class="col"></div>
          <div class="col"></div>
        </div>

        <nav class="menu" aria-label="Secciones">
          <a href="index-experimentos.html" id="m1">Experimentos</a>
          <a href="index-proyectos.html" id="m2">Proyectos</a>
          <a href="index-galeria.html" id="m3">Galería</a>
          <a href="index-bio.html" id="m4">Bio</a>
          <a href="index-integrantes.html" id="m5">Integrantes</a>
        </nav>
      </div>
    </section>
  </main>

  <script>
    const frame = document.getElementById('frame');
    const cols = [...document.querySelectorAll('.col')];

    function randomProportions(n, minFrac = 0.18) {
      const rest = 1 - n * minFrac;
      const cuts = Array.from({ length: n - 1 }, () => Math.random()).sort((a, b) => a - b);
      const parts = [];
      let prev = 0;
      for (let i = 0; i < cuts.length; i++) {
        parts.push(cuts[i] - prev);
        prev = cuts[i];
      }
      parts.push(1 - prev);
      return parts.map(p => p * rest + minFrac);
    }

    // Fibonacci: cada clic avanza un paso (1·1·2 → 1·2·3 → 2·3·5 → 3·5·8 → 5·8·13 …) y vuelve a empezar
    const fib = [1, 1, 2, 3, 5, 8, 13, 21];
    let paso = 0;

    function randomize() {
      const trio = fib.slice(paso, paso + 3);
      paso = (paso + 1) % (fib.length - 2);
      for (let i = trio.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [trio[i], trio[j]] = [trio[j], trio[i]];
      }
      const total = trio[0] + trio[1] + trio[2];
      const widths = trio.map(v => v / total);
      cols.forEach((el, i) => el.style.width = (widths[i] * 100).toFixed(2) + '%');
      if (Math.random() < 0.5) {
        [...cols].reverse().forEach(c => frame.appendChild(c));
      }
    }

    // --- Idiomas ---
    const textos = {
      es: { m1: 'Experimentos', m2: 'Proyectos', m3: 'Galería',  m4: 'Bio', m5: 'Integrantes', click: 'Click para cambiar',   secciones: 'Secciones', idioma: 'Idioma' },
      en: { m1: 'Experiments',  m2: 'Projects',  m3: 'Gallery',  m4: 'Bio', m5: 'Members',     click: 'Click to change',      secciones: 'Sections',  idioma: 'Language' },
      fr: { m1: 'Expériences',  m2: 'Projets',   m3: 'Galerie',  m4: 'Bio', m5: 'Membres',     click: 'Cliquez pour changer', secciones: 'Sections',  idioma: 'Langue' },
      de: { m1: 'Experimente',  m2: 'Projekte',  m3: 'Galerie',  m4: 'Bio', m5: 'Mitglieder',  click: 'Klicken zum Ändern',   secciones: 'Bereiche',  idioma: 'Sprache' }
    };

    function setLang(l) {
      const t = textos[l] || textos.es;
      document.documentElement.lang = l;
      ['m1', 'm2', 'm3', 'm4', 'm5'].forEach(id => document.getElementById(id).textContent = t[id]);
      frame.title = t.click;
      document.querySelector('.menu').setAttribute('aria-label', t.secciones);
      document.getElementById('lang').setAttribute('aria-label', t.idioma);
      document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
      try { localStorage.setItem('hz-lang', l); } catch (e) {}
    }

    document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

    let guardado = 'es';
    try { guardado = localStorage.getItem('hz-lang') || 'es'; } catch (e) {}
    setLang(guardado);

    window.addEventListener('DOMContentLoaded', randomize);
    frame.addEventListener('click', randomize);
    frame.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        randomize();
      }
    });
  </script>

</body>
</html>
